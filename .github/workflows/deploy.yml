name: $bog_vmap

permissions: write-all

# Только `main` и запуск руками. Ветки и pull_request убраны 09.09.2026, и вот
# почему: `hyoo-ru/mam_build@master2` клонирует репозиторий пака `--depth=1` без
# указания ветки, а потом делает `git checkout <ref>` — в мелком клоне ничего,
# кроме ветки по умолчанию, нет. Замерено: прогон на ветке падает с
# `error: pathspec '<ветка>' did not match any file(s) known to git`. То есть
# триггер `branches: ['**']` обещал сборку любой ветки и не мог её дать.
# Чинить надо действие, а не триггер: вернёшь `['**']` — вернёшь красные прогоны.
#
# Пока веток нет, всё проверяется прямо на `main`, а `cancel-in-progress` ниже
# при частых пушах рубит недобежавшие прогоны. Поэтому «прогон зелёный» здесь
# всегда значит «ПОСЛЕДНИЙ прогон зелёный», а не «все прогоны зелёные».
on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

    # Пять модулей одним прогоном: `modules` бьётся по пробелам и каждое имя
    # дописывается к пакету, артефакты ложатся в <модуль>/-/. Страница есть только
    # у `app`, и сборке она не нужна: `scene` собирается ради `web.js`, который
    # редактор подтягивает в кадр тегом скрипта, а `part` — ради `web.view.tree`
    # рядом с `web.js`, это и есть библиотека компонентов палитры по умолчанию.
    #
    # `demo` и `pages` — приёмочные фикстуры экспорта, и собираются они здесь
    # затем, что проверить их больше нечем: юнит-тест не показывает, собирается
    # ли выгруженный документ, это умеет только сборка. Оба readme обещают именно
    # прогон CI, и до 09.09.2026 обещание было неправдой — фикстуры собирал тот,
    # кто вспомнит, то есть ровно не тогда, когда их ломают. Публиковать их не
    # надо: шага `gh-deploy` у них нет, папок на сайте они не заводят, и
    # `clean-exclude` ниже их не касается.
    # Chrome ставится ДО сборки, потому что `smoke` идёт последним в списке ниже и
    # гоняет свой node-тест прямо в пайплайне сборки. Адрес бинаря кладётся в
    # `CHROME_PATH`: тест ищет браузер сперва по нему, а `command -v chrome` держим
    # запасным путём. Без браузера тест печатает «Chrome не найден, дымовой тест
    # пропущен» и остаётся зелёным — это честный пропуск, а не молчаливая зелень.
    - uses: browser-actions/setup-chrome@v1
      id: chrome
      with:
        chrome-version: stable

    # `test -x` здесь обязателен. Честный пропуск без браузера придуман для машины
    # молера, а в CI пустой путь означал бы, что деплой охраняет тест, который не
    # запускался, и охрана эта молчаливая. Пусть шаг падает вслух.
    - name: Point the smoke test at Chrome
      run: |
        set -euo pipefail
        test -x "${{ steps.chrome.outputs.chrome-path }}"
        echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

    # `smoke` последним: он поднимает собранный `app/-/index.html` со статики и
    # требует готовых `scene` и `part` рядом. Красный дымовой тест кладёт этот шаг
    # со статусом 1, и ни один `gh-deploy` ниже не выполняется — у шагов с `if`
    # неявная проверка `success()` остаётся в силе.
    - uses: hyoo-ru/mam_build@master2
      with:
        package: 'bog/vmap'
        modules: 'app scene part demo pages smoke'

    # `$mol_run.spawn` глотает stdout прогона тестов, и в логе от дымового теста остаётся
    # только строка запуска: по ней не отличить настоящий прогон от честного пропуска без
    # браузера. Поэтому тест кладёт свой отчёт файлом, а этот шаг требует в нём строку про
    # перезапуск сцены — она печатается только после полного сценария — и выносит замеры
    # в сводку прогона.
    - name: Smoke report
      run: |
        set -euo pipefail
        file="bog/vmap/smoke/-/smoke.log"
        test -s "$file"
        grep -q 'перезапуск одним нажатием' "$file"
        {
          echo '```'
          cat "$file"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    # GitHub Pages отдаёт web.js с `cache-control: max-age=600`, поэтому первые
    # десять минут после деплоя вернувшийся читатель получает старый бандл и
    # видит ровно то, что уже починили. Ссылка со стемпом коммита делает адрес
    # бандла новым на каждый деплой — кэшу нечего отдавать.
    #
    # Штампуется одна страница, потому что она одна и есть. Бандл сцены кэш
    # держит так же, но его адрес собирает редактор, и приезжает он из свежего
    # `web.js` редактора вместе со всем остальным.
    - name: Cache-bust the bundle
      if: github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        stamp="${GITHUB_SHA::7}"
        file="bog/vmap/app/-/index.html"
        sed -i "s|src=\"web.js\"|src=\"web.js?v=$stamp\"|" "$file"
        grep -q "web.js?v=$stamp" "$file"

    # Редактор в корне сайта: одна страница на весь проект, и она первая. Витрины
    # больше нет — вести с неё было некуда, у соседей страниц не осталось.
    #
    # `clean-exclude` обязателен: rsync --delete в корне снёс бы папки модулей,
    # которые кладутся следующими шагами.
    - uses: hyoo-ru/gh-deploy@v4.4.1
      if: github.ref == 'refs/heads/main'
      with:
        folder: 'bog/vmap/app/-'
        clean-exclude: |
          scene
          part

    # Модули без страниц. `target-folder` уводит rsync --delete внутрь подпапки,
    # поэтому соседей и корень они не трогают.
    #
    # Редактор выводит оба адреса из адреса собственной страницы: на деплое он
    # сам корень, и модули лежат папками под ним, а на дев-сервере путь ещё несёт
    # `-/`. Настраивать нечего ни там, ни там.
    - uses: hyoo-ru/gh-deploy@v4.4.1
      if: github.ref == 'refs/heads/main'
      with:
        folder: 'bog/vmap/scene/-'
        target-folder: 'scene'
        commit-message: 'deploy scene'

    - uses: hyoo-ru/gh-deploy@v4.4.1
      if: github.ref == 'refs/heads/main'
      with:
        folder: 'bog/vmap/part/-'
        target-folder: 'part'
        commit-message: 'deploy part'

    - name: URLs
      if: github.ref == 'refs/heads/main'
      run: |
        {
          echo "- https://b-on-g.github.io/vmap/ — редактор, единственная страница проекта"
          echo "- https://b-on-g.github.io/vmap/scene/web.js — бандл песочницы, поднимается в кадр"
          echo "- https://b-on-g.github.io/vmap/part/web.view.tree — дерево классов пака деталей"
        } >> "$GITHUB_STEP_SUMMARY"

<!doctype html>
<!--
	`color-scheme` is what gives a frame its base background, and it has to be
	declared: without it Chrome keeps a transparent frame transparent only until
	something inside takes a compositing layer — the camera transform on `Stage`
	does — and from then on fills it with a pale base of its own. Measured in a
	live window with `requestAnimationFrame` ticking, not under automation.

	So the frame is opaque on purpose now, and everything that has to be seen
	beneath the document lives inside it: the canvas grid moved in here with it.
	Inline rather than by a rule, so that it also holds during the first paint,
	before `web.js` has loaded.
-->
<html lang="en" mol_view_root style=" height: 100%; width: 100%; color-scheme: dark ">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1" />
		<title>$bog_vmap scene</title>
	</head>
	<body mol_view_root style=" padding: 0; margin: 0; height: 100%; width: 100% ">
		<div mol_view_root="$bog_vmap_scene"></div>
		<script src="web.js" charset="utf-8"></script>
	
				<script src="/mol/build/client/client.js" charset="utf-8"></script>
				<script src="web.test.js" charset="utf-8"></script>
				<script>
					addEventListener( 'load', ()=> setTimeout( ()=> {
						const audit =  document.createElement( 'script' )
						audit.src = 'web.audit.js'
						document.head.appendChild( audit )
					}, 500 ) )
				</script>
				</body>
</html>
